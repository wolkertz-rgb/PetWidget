name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Ставим Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Готовим постоянный ключ подписи
        run: |
          mkdir -p keystore
          if [ ! -f keystore/petdebug.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/petdebug.keystore \
              -alias pet \
              -keyalg RSA -keysize 2048 \
              -validity 10950 \
              -storepass petwidget123 \
              -keypass petwidget123 \
              -dname "CN=PetWidget, OU=Pet, O=PetWidget, L=Home, S=Home, C=RU" \
              -noprompt
            git config user.name "pet-robot"
            git config user.email "pet-robot@users.noreply.github.com"
            git add keystore/petdebug.keystore
            git commit -m "chore: сохраняем постоянный ключ подписи APK" --no-verify
            git push
          fi

      - name: Собираем APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Сохраняем APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: petwidget-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
